# Tier 1: every push and every PR. No LLM, no secrets, ~1 minute.
# Guardrail unit tests, red-team vs input guardrails, pipeline tests with a fake model, dataset lint.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests + guardrail tests + dataset lint
        run: ./mvnw -B verify
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
